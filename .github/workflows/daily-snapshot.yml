name: Daily Dashboard Email Snapshot

on:
  schedule:
    - cron: '0 3 * * *' # 08:30 AM IST daily
  workflow_dispatch:    # Manual test button in GitHub Actions tab

jobs:
  send-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright & Nodemailer
        run: |
          npm init -y
          npm install playwright nodemailer
          npx playwright install chromium --with-deps

      - name: Capture and Email Snapshot
        env:
          OUTLOOK_USER: ${{ secrets.OUTLOOK_USER }}
          OUTLOOK_PASS: ${{ secrets.OUTLOOK_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node scripts/send-snapshot.mjs
